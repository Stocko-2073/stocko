[project]
name = "agentcam"
version = "0.1.0"
description = "MCP server that lets an agent request posed photos from the AgentCam iOS app"
requires-python = ">=3.12,<3.13"
dependencies = [
    # v2 renamed FastMCP to MCPServer.
    "mcp>=2.2,<3",
    "aiohttp>=3.10",
    "numpy",
    "pillow",
    # Keep in step with opencv-spm in agentcam/Packages/AgentCamVision/Package.swift,
    # so the phone and the Mac see the same detections.
    "opencv-python-headless==4.13.*",
]

[project.scripts]
agentcam-mcp = "agentcam.server:main"
agentcam-fakephone = "agentcam.fakephone:main"

[dependency-groups]
dev = ["pytest", "pytest-asyncio"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentcam"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
