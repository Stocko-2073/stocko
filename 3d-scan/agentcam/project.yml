# XcodeGen spec. This file is the source of truth; AgentCam.xcodeproj and
# AgentCam/Info.plist are generated and gitignored.
#
#   cd 3d-scan/agentcam && xcodegen generate && open AgentCam.xcodeproj
#
name: AgentCam

options:
  bundleIdPrefix: com.stocko
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  # Protocol, geometry, tracking fusion, guidance and networking: plain Swift,
  # tested on the Mac with `swift test`.
  AgentCamCore:
    path: Packages/AgentCamCore
  # OpenCV marker detection and planar PnP, the same algorithm as the server.
  AgentCamVision:
    path: Packages/AgentCamVision

settings:
  base:
    # Swift 5 language mode on purpose (as in u-bot): the tracking session,
    # link and uploader own serial queues and must never hop to the main actor.
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "266VNLKVKQ"  # Sam Washburn. Xcode must be signed in as sam@samwashburn.com
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO

targets:
  AgentCam:
    type: application
    platform: iOS
    sources:
      - path: AgentCam
    dependencies:
      - package: AgentCamCore
        product: AgentCamCore
      - package: AgentCamVision
        product: AgentCamVision
    info:
      path: AgentCam/Info.plist
      properties:
        CFBundleDisplayName: AgentCam
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        # Without it the app renders as a legacy 375x568 box (see u-bot).
        UILaunchScreen: {}

        # Shown verbatim in the system alerts.
        NSCameraUsageDescription:
          AgentCam uses the camera to find the marker mat, guide you to the
          view your agent asked for, and take the photo.
        NSLocalNetworkUsageDescription:
          AgentCam finds your Mac on this Wi-Fi network to receive photo
          requests and send the photos back.
        # Browsing a Bonjour type that isn't listed here fails (-65555).
        NSBonjourServices:
          - _agentcam._tcp
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true

        # Captures wait in Documents/Outbox until the Mac has them; this makes
        # them reachable through the Files app if Wi-Fi never cooperates.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true

        # Portrait only. The camera view is 3:4 so it shows the whole sensor
        # image; landscape holds are just the phone turned, HUD included.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UIUserInterfaceStyle: Dark
        UIRequiredDeviceCapabilities:
          - arm64
          - arkit
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # No UIBackgroundModes: requests wait on the Mac while the app is closed.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stocko.agentcam
        TARGETED_DEVICE_FAMILY: "1"     # iPhone only

  AgentCamTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AgentCamTests]
    dependencies:
      - target: AgentCam
      - package: AgentCamCore
        product: AgentCamCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  AgentCam:
    build:
      targets:
        AgentCam: all
    test:
      targets:
        - AgentCamTests
