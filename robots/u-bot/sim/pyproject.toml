[project]
name = "ubot-sim"
version = "0.1.0"
description = "MuJoCo model and driving environment for U-bot"
requires-python = ">=3.11,<3.14"
dependencies = ["mujoco>=3.3,<4", "gymnasium>=1.1,<2", "numpy>=2,<3"]

[project.optional-dependencies]
train = ["stable-baselines3>=2.6,<3"]
dev = ["pytest>=8,<10"]
video = ["pillow>=11,<13"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
ubot_sim = ["assets/*.xml", "assets/*.stl", "assets/*.json"]

[tool.setuptools.packages.find]
include = ["ubot_sim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
